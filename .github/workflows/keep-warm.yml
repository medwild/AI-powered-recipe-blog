name: Keep Vercel Warm

# DISABLED 2026-08-03 — migration vers Hostinger Node.js (cold starts Vercel sans objet).
# Conservé en manuel (workflow_dispatch) pour les tests de disponibilité.

on:
  schedule: []
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping www.chefaugustin.com
        run: |
          echo "=== $(date -u) ==="
          HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' \
            --connect-timeout 15 --max-time 15 \
            https://www.chefaugustin.com 2>&1 || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is warm"
          else
            echo "⚠️  Unexpected status: $HTTP_CODE"
          fi
