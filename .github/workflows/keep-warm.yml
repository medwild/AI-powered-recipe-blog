name: Keep Vercel Warm

# Pings the site every 5 minutes to prevent Vercel Hobby cold starts.
# Cold start = 20-60s delay = browser ERR_CONNECTION_TIMED_OUT.
# This keeps the serverless function alive.

on:
  schedule:
    # Every 5 minutes (avoid :00/:30 to reduce contention)
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping www.chefaugustin.com
        run: |
          echo "=== $(date -u) ==="
          HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' \
            --connect-timeout 15 --max-time 15 \
            https://www.chefaugustin.com 2>&1 || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is warm"
          else
            echo "⚠️  Unexpected status: $HTTP_CODE"
          fi
